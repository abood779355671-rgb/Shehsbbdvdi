version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ytdl_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ytdl
      POSTGRES_PASSWORD: ytdl_password
      POSTGRES_DB: ytdl_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytdl -d ytdl_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ytdl_network

  redis:
    image: redis:7-alpine
    container_name: ytdl_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ytdl_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ytdl_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ytdl:ytdl_password@db:5432/ytdl_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-long-random-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-abood123}
      DOWNLOAD_DIR: /app/downloads
    volumes:
      - downloads_data:/app/downloads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ytdl_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ytdl_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend
    networks:
      - ytdl_network

  nginx:
    image: nginx:alpine
    container_name: ytdl_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - ytdl_network

volumes:
  postgres_data:
  redis_data:
  downloads_data:
  nginx_logs:

networks:
  ytdl_network:
    driver: bridge
